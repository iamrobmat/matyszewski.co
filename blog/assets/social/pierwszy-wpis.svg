<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#151515" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#151515" flood-opacity="0.14"/>
    </filter>
    <clipPath id="profile-clip">
      <circle cx="956" cy="315" r="136"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f8f8f5"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="72" y="72" width="1056" height="486" rx="18" fill="#ffffff" fill-opacity="0.88" stroke="#151515" stroke-opacity="0.14" filter="url(#shadow)"/>
  <text x="96" y="142" fill="#151515" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">matyszewski.co</text>
  <image href="robert-matyszewski-profile.png" x="820" y="179" width="272" height="272" preserveAspectRatio="xMidYMid slice" clip-path="url(#profile-clip)"/>
  <circle cx="956" cy="315" r="136" fill="none" stroke="#151515" stroke-opacity="0.14" stroke-width="2"/>

  <text x="96" y="277" fill="#151515" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">Pierwszy wpis</text>

  <rect x="96" y="482" width="190" height="48" rx="12" fill="#1f6b4a"/>
  <text x="191" y="513" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">Czytaj blog</text>
  <text x="310" y="513" fill="#5e625f" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">matyszewski.co/blog</text>
</svg>