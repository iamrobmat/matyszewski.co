<!doctype html>
<!-- Kanoniczny przykład fotograficznego OG w stylu Robert Bold Minimal. -->
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <title>Social image — szkolenie AI w BPNT</title>
    <style>
      @font-face {
        font-family: "Archivo Black";
        src: url("../../blog/assets/social/fonts/ArchivoBlack-Regular.woff2") format("woff2");
        font-weight: 400;
      }

      @font-face {
        font-family: Archivo;
        src: url("../../blog/assets/social/fonts/Archivo-Variable.woff2") format("woff2");
        font-weight: 100 900;
      }

      :root {
        --plate: #050505;
        --on-plate: #ffffff;
        --signal: #ffd60a;
        --on-signal: #050505;
        --display: "Archivo Black", Archivo, "Arial Black", sans-serif;
        --text: Archivo, "Helvetica Neue", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #0d0d0f;
      }

      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 54%;
      }

      .copy {
        position: absolute;
        top: 56px;
        left: 56px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .title {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.22em;
        font: 400 78px/1.2 var(--display);
        letter-spacing: -0.03em;
      }

      .plate {
        display: table;
        width: max-content;
        padding: 0 0.18em;
        border-radius: 0;
        background: var(--plate);
        color: var(--on-plate);
        white-space: nowrap;
      }

      .signal {
        background: var(--signal);
        color: var(--on-signal);
      }

      .kicker {
        margin-top: 18px;
        font: 650 27px/1.35 var(--text);
        letter-spacing: -0.01em;
      }

      .url {
        position: absolute;
        right: 56px;
        bottom: 30px;
        font: 650 20px/1.35 var(--text);
      }
    </style>
  </head>
  <body>
    <main class="frame">
      <img class="photo" src="../../blog/assets/bpnt-szkolenie-agenci-ai/foto-18.jpg" alt="">
      <section class="copy" aria-label="Tytuł wpisu">
        <div class="title">
          <div class="plate">OD CZATU DO</div>
          <div class="plate signal">AGENTA AI</div>
        </div>
        <div class="plate kicker">RELACJA ZE SZKOLENIA BPNT</div>
      </section>
      <div class="plate url">MATYSZEWSKI.CO/BLOG</div>
    </main>
  </body>
</html>
